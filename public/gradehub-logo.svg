<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Globe Icon -->
  <g transform="translate(4, 6)">
    <!-- Globe circle -->
    <circle cx="22" cy="22" r="20" fill="url(#globeGrad)" opacity="0.15"/>
    <circle cx="22" cy="22" r="18" fill="none" stroke="url(#globeGrad)" stroke-width="2"/>
    
    <!-- Globe lines (latitude/longitude) -->
    <ellipse cx="22" cy="22" rx="10" ry="18" fill="none" stroke="url(#globeGrad)" stroke-width="1.2" opacity="0.6"/>
    <ellipse cx="22" cy="22" rx="18" ry="10" fill="none" stroke="url(#globeGrad)" stroke-width="1.2" opacity="0.6"/>
    <line x1="22" y1="4" x2="22" y2="40" stroke="url(#globeGrad)" stroke-width="1" opacity="0.4"/>
    <line x1="4" y1="22" x2="40" y2="22" stroke="url(#globeGrad)" stroke-width="1" opacity="0.4"/>
    
    <!-- Graduation cap on globe -->
    <g transform="translate(12, 10)">
      <!-- Cap board -->
      <polygon points="10,2 20,7 10,12 0,7" fill="url(#capGrad)"/>
      <!-- Cap top peak -->
      <polygon points="10,0 14,2 10,4 6,2" fill="#1E40AF"/>
      <!-- Tassel -->
      <line x1="18" y1="7" x2="22" y2="14" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="22" cy="15" r="1.5" fill="#F59E0B"/>
    </g>
    
    <!-- Upward path/arrow representing journey -->
    <path d="M8 36 L22 8 L36 36" fill="none" stroke="url(#globeGrad)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2,2" opacity="0.5"/>
    <polygon points="22,6 26,14 18,14" fill="url(#globeGrad)" opacity="0.7"/>
  </g>
  
  <!-- Text: GradeHub -->
  <text x="52" y="35" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#1E293B">
    Grade<tspan fill="#4F46E5">Hub</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="52" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#64748B" letter-spacing="1.5" text-transform="uppercase" font-weight="500">
    GLOBAL ADMISSIONS PLATFORM
  </text>
</svg>
