<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="24" cy="24" r="23" fill="url(#globeGrad)"/>
  
  <!-- Globe outline -->
  <circle cx="24" cy="24" r="16" fill="none" stroke="white" stroke-width="1.5" opacity="0.9"/>
  
  <!-- Globe lines -->
  <ellipse cx="24" cy="24" rx="8" ry="16" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>
  <ellipse cx="24" cy="24" rx="16" ry="8" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>
  
  <!-- Graduation cap -->
  <g transform="translate(16, 14)">
    <polygon points="8,2 16,6 8,10 0,6" fill="white"/>
    <polygon points="8,0 11,2 8,4 5,2" fill="white" opacity="0.8"/>
    <line x1="14" y1="6" x2="18" y2="12" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="18" cy="13" r="1.5" fill="#F59E0B"/>
  </g>
  
  <!-- Upward arrow path -->
  <path d="M12 36 L24 10 L36 36" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2,2" opacity="0.4"/>
  <polygon points="24,8 28,16 20,16" fill="white" opacity="0.6"/>
</svg>
